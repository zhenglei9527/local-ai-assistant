# Gradle JVM tuning.
#
# -Xmx4g rather than the template's 2g: the RN codegen + Kotlin compile step for
# a project with three native modules is memory-hungry, and an OOM during
# codegen surfaces as a confusing "task failed" with no clear cause.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Parallel + caching: safe here because the module graph is small and the
# configuration cache is supported by RN 0.83's plugin.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX is mandatory for RN 0.83.
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# llama.rn
# ---------------------------------------------------------------------------
#
# Prebuilt native libraries are downloaded from the matching GitHub release by
# the package's postinstall hook and cached. Leave this false unless you are
# actively patching llama.cpp itself — building from source takes 20-40 minutes
# on a laptop and requires a matching NDK.
rnllamaBuildFromSource=false

# New Architecture. llama.rn requires it as of v0.10 (the JSI bindings are
# installed through the TurboModule path). Do not disable.
newArchEnabled=true

# Hermes.
hermesEnabled=true

# ---------------------------------------------------------------------------
# Our own flags
# ---------------------------------------------------------------------------
#
# Surfaced into BuildConfig so the Settings screen can report the intended
# backend without guessing.
phonellm.defaultContextLength=4096
phonellm.enableHexagonNpu=false
